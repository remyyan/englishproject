<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Weight of the Mask: An ENG4U Synthesis</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <style>
    body {
      margin: 0;
      background: #050509;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      image-rendering: pixelated;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script>
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    const WORLD_WIDTH = 3900;
    const GROUND_Y = 500;

    class StartScene extends Phaser.Scene {
      constructor() {
        super('StartScene');
      }

      create() {
        this.cameras.main.setBackgroundColor('#080811');

        this.add.text(GAME_WIDTH / 2, 120, 'The Weight of the Mask', {
          fontFamily: 'Georgia, serif',
          fontSize: '48px',
          color: '#ffffff',
          align: 'center'
        }).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, 178, 'An ENG4U Synthesis', {
          fontFamily: 'Georgia, serif',
          fontSize: '28px',
          color: '#cfcfff',
          align: 'center'
        }).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          270,
          'Keep moving forward, but do not let the expectations of others crush you.',
          {
            fontFamily: 'Arial, sans-serif',
            fontSize: '22px',
            color: '#f5f5f5',
            align: 'center',
            wordWrap: { width: 760 }
          }
        ).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, 365, 'Arrow keys: move   |   Spacebar: jump', {
          fontFamily: 'Arial, sans-serif',
          fontSize: '20px',
          color: '#ffd35a',
          align: 'center'
        }).setOrigin(0.5);

        const prompt = this.add.text(GAME_WIDTH / 2, 440, 'Press SPACE to begin', {
          fontFamily: 'Arial, sans-serif',
          fontSize: '24px',
          color: '#ffffff'
        }).setOrigin(0.5);

        this.tweens.add({
          targets: prompt,
          alpha: 0.25,
          duration: 650,
          yoyo: true,
          repeat: -1
        });

        this.input.keyboard.once('keydown-SPACE', () => this.scene.start('GameScene'));
      }
    }

    class GameScene extends Phaser.Scene {
      constructor() {
        super('GameScene');
        this.pressure = 0;
        this.lastPressureResetX = 80;
        this.currentJumpVelocity = -520;
        this.shakeCooldown = 0;
      }

      create() {
        this.pressure = 0;
        this.lastPressureResetX = 80;
        this.currentJumpVelocity = -520;
        this.shakeCooldown = 0;

        this.physics.world.setBounds(0, 0, WORLD_WIDTH, GAME_HEIGHT);
        this.physics.world.gravity.y = 620;

        this.createWorldArt();
        this.createPlatforms();
        this.createPlayer();
        this.createCollectibles();
        this.createPortal();
        this.createUi();

        this.cameras.main.setBounds(0, 0, WORLD_WIDTH, GAME_HEIGHT);
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
      }

      createWorldArt() {
        this.add.rectangle(600, 270, 1200, GAME_HEIGHT, 0x2b2624).setOrigin(0.5);
        this.add.rectangle(1800, 270, 1200, GAME_HEIGHT, 0x122943).setOrigin(0.5);
        this.add.rectangle(3000, 270, 1800, GAME_HEIGHT, 0x1a102c).setOrigin(0.5);

        this.add.text(90, 55, 'ZONE 1: THE PARK — Brother', {
          fontFamily: 'Georgia, serif',
          fontSize: '24px',
          color: '#f2c26b'
        });
        this.add.text(1290, 55, 'ZONE 2: THE LABORATORY — Frankenstein', {
          fontFamily: 'Georgia, serif',
          fontSize: '24px',
          color: '#aee9ff'
        });
        this.add.text(2490, 55, 'ZONE 3: THE CASTLE GRAVEYARD — Hamlet', {
          fontFamily: 'Georgia, serif',
          fontSize: '24px',
          color: '#d4b0ff'
        });

        for (let x = 130; x < 1100; x += 210) {
          this.add.rectangle(x, GROUND_Y - 60, 40, 120, 0x161616).setOrigin(0.5);
          this.add.rectangle(x + 24, GROUND_Y - 125, 90, 16, 0x333333).setOrigin(0.5);
        }

        for (let x = 1300; x < 2300; x += 190) {
          this.add.rectangle(x, 245, 16, 250, 0xd9fbff).setAlpha(0.18);
          this.add.rectangle(x + 40, 180, 70, 18, 0x9ff4ff).setAlpha(0.38);
          this.add.line(x, 0, 0, 315, 80, 260, 0xffffff).setAlpha(0.25);
        }

        for (let x = 2520; x < 3720; x += 180) {
          this.add.rectangle(x, GROUND_Y - 28, 80, 56, 0x2d2d36).setOrigin(0.5);
          this.add.rectangle(x, GROUND_Y - 65, 45, 18, 0x3a3a46).setOrigin(0.5);
          this.add.rectangle(x, GROUND_Y - 90, 15, 48, 0x3a3a46).setOrigin(0.5);
        }
      }

      createPlatforms() {
        this.platforms = this.physics.add.staticGroup();

        const addPlatform = (x, y, width, height = 28) => {
          const platform = this.add.rectangle(x, y, width, height, 0x303030).setOrigin(0.5);
          this.physics.add.existing(platform, true);
          this.platforms.add(platform);
          return platform;
        };

        addPlatform(WORLD_WIDTH / 2, GROUND_Y + 20, WORLD_WIDTH, 40);

        addPlatform(310, 410, 210);
        addPlatform(640, 350, 180);
        addPlatform(920, 430, 240);
        addPlatform(1260, 390, 190);
        addPlatform(1510, 325, 150);
        addPlatform(1790, 385, 210);
        addPlatform(2110, 305, 170);
        addPlatform(2450, 420, 220);
        addPlatform(2760, 345, 160);
        addPlatform(3050, 405, 240);
        addPlatform(3350, 330, 190);
      }

      createPlayer() {
        this.player = this.add.rectangle(80, 430, 34, 52, 0xffffff).setOrigin(0.5);
        this.physics.add.existing(this.player);
        this.player.body.setCollideWorldBounds(true);
        this.player.body.setSize(34, 52);
        this.physics.add.collider(this.player, this.platforms);
      }

      createCollectibles() {
        this.collectibles = this.physics.add.staticGroup();

        const addCollectible = (x, y, label, quote) => {
          const item = this.add.container(x, y);
          const glow = this.add.circle(0, 0, 34, 0xffd23c, 0.18);
          const body = this.add.rectangle(0, 0, 38, 38, 0xffcc33);
          const text = this.add.text(0, 1, label, {
            fontFamily: 'Arial, sans-serif',
            fontSize: '23px',
            color: '#181818',
            fontStyle: 'bold'
          }).setOrigin(0.5);
          item.add([glow, body, text]);
          item.quote = quote;
          this.physics.add.existing(item, true);
          item.body.setSize(44, 44);
          this.collectibles.add(item);
          this.tweens.add({ targets: item, y: y - 10, duration: 900, yoyo: true, repeat: -1 });
        };

        addCollectible(710, 302, '♫', 'We were children of the sun... trying to find a way to belong.');
        addCollectible(1840, 337, '⚡', 'I ought to be thy Adam, but I am rather the fallen angel.');
        addCollectible(3105, 357, '☠', 'To be, or not to be: that is the question.');

        this.physics.add.overlap(this.player, this.collectibles, (_player, collectible) => {
          if (!collectible.active) return;
          collectible.body.enable = false;
          collectible.setActive(false);
          collectible.setVisible(false);
          this.tweens.killTweensOf(collectible);
          this.resetPressure(collectible.quote);
        });
      }

      createPortal() {
        this.portal = this.add.rectangle(3770, GROUND_Y - 75, 70, 130, 0x8f5cff).setOrigin(0.5);
        this.portalInner = this.add.rectangle(3770, GROUND_Y - 75, 44, 100, 0x0f0820).setOrigin(0.5);
        this.physics.add.existing(this.portal, true);
        this.tweens.add({
          targets: this.portal,
          alpha: 0.45,
          duration: 520,
          yoyo: true,
          repeat: -1
        });
        this.physics.add.overlap(this.player, this.portal, () => this.scene.start('EndScene'));
      }

      createUi() {
        this.uiBackground = this.add.rectangle(0, 0, GAME_WIDTH, 74, 0x000000, 0.62)
          .setOrigin(0, 0)
          .setScrollFactor(0)
          .setDepth(1000);

        this.add.text(24, 14, 'SOCIETAL PRESSURE', {
          fontFamily: 'Arial, sans-serif',
          fontSize: '17px',
          color: '#ffffff',
          fontStyle: 'bold'
        }).setScrollFactor(0).setDepth(1001);

        this.pressureFrame = this.add.rectangle(24, 43, 360, 18, 0xffffff, 0.20)
          .setOrigin(0, 0.5)
          .setScrollFactor(0)
          .setDepth(1001);
        this.pressureBar = this.add.rectangle(24, 43, 0, 16, 0xffd23c)
          .setOrigin(0, 0.5)
          .setScrollFactor(0)
          .setDepth(1002);
        this.pressureText = this.add.text(398, 33, '0%', {
          fontFamily: 'Arial, sans-serif',
          fontSize: '18px',
          color: '#ffffff'
        }).setScrollFactor(0).setDepth(1001);

        this.quoteBox = this.add.rectangle(GAME_WIDTH / 2, 106, 790, 72, 0x000000, 0.72)
          .setScrollFactor(0)
          .setDepth(1000)
          .setVisible(false);
        this.quoteText = this.add.text(GAME_WIDTH / 2, 106, '', {
          fontFamily: 'Georgia, serif',
          fontSize: '22px',
          color: '#fff2b6',
          align: 'center',
          wordWrap: { width: 740 }
        }).setOrigin(0.5).setScrollFactor(0).setDepth(1001).setVisible(false);

        this.struggleOverlay = this.add.rectangle(0, 0, GAME_WIDTH, GAME_HEIGHT, 0x777777, 0)
          .setOrigin(0, 0)
          .setScrollFactor(0)
          .setDepth(900);
      }

      resetPressure(quote) {
        this.lastPressureResetX = this.player.x;
        this.pressure = 0;
        this.physics.world.gravity.y = 620;
        this.currentJumpVelocity = -520;
        this.showQuote(quote);
      }

      showQuote(quote) {
        this.quoteText.setText(quote);
        this.quoteBox.setVisible(true);
        this.quoteText.setVisible(true);
        this.time.delayedCall(3600, () => {
          this.quoteBox.setVisible(false);
          this.quoteText.setVisible(false);
        });
      }

      update(time, delta) {
        const speed = 225;

        if (this.cursors.left.isDown) {
          this.player.body.setVelocityX(-speed);
        } else if (this.cursors.right.isDown) {
          this.player.body.setVelocityX(speed);
        } else {
          this.player.body.setVelocityX(0);
        }

        if (Phaser.Input.Keyboard.JustDown(this.spaceKey) && this.player.body.blocked.down) {
          this.player.body.setVelocityY(this.currentJumpVelocity);
        }

        this.updatePressure(delta);
        this.updatePressureUi();
      }

      updatePressure(delta) {
        /*
          PRESSURE DIFFICULTY CONTROLS:
          - PRESSURE_DISTANCE controls how far the player can travel after a reset
            before the pressure gauge reaches 100%.
          - BASE_GRAVITY and MAX_EXTRA_GRAVITY control how heavy the world becomes.
          - BASE_JUMP_VELOCITY and MAX_JUMP_LOSS control how much weaker jumping gets.
          Increase PRESSURE_DISTANCE or lower MAX_EXTRA_GRAVITY / MAX_JUMP_LOSS to make
          the project easier; do the opposite to make expectation feel more crushing.
        */
        const PRESSURE_DISTANCE = 1050;
        const BASE_GRAVITY = 620;
        const MAX_EXTRA_GRAVITY = 650;
        const BASE_JUMP_VELOCITY = -520;
        const MAX_JUMP_LOSS = 250;
        const HIGH_PRESSURE_THRESHOLD = 70;

        const distanceSinceReset = Math.max(0, this.player.x - this.lastPressureResetX);
        this.pressure = Phaser.Math.Clamp((distanceSinceReset / PRESSURE_DISTANCE) * 100, 0, 100);

        const pressureRatio = this.pressure / 100;
        this.physics.world.gravity.y = BASE_GRAVITY + (MAX_EXTRA_GRAVITY * pressureRatio);
        this.currentJumpVelocity = BASE_JUMP_VELOCITY + (MAX_JUMP_LOSS * pressureRatio);

        this.struggleOverlay.setAlpha(Phaser.Math.Clamp((this.pressure - 55) / 180, 0, 0.25));

        this.shakeCooldown -= delta;
        if (this.pressure >= HIGH_PRESSURE_THRESHOLD && this.shakeCooldown <= 0) {
          const shakeStrength = 0.003 + (pressureRatio * 0.006);
          this.cameras.main.shake(120, shakeStrength);
          this.shakeCooldown = 950;
        }
      }

      updatePressureUi() {
        const width = 360 * (this.pressure / 100);
        const color = Phaser.Display.Color.Interpolate.ColorWithColor(
          new Phaser.Display.Color(255, 210, 60),
          new Phaser.Display.Color(230, 42, 58),
          100,
          this.pressure
        );
        const colorValue = Phaser.Display.Color.GetColor(color.r, color.g, color.b);

        this.pressureBar.setSize(width, 16);
        this.pressureBar.setFillStyle(colorValue, 1);
        this.pressureText.setText(`${Math.round(this.pressure)}%`);
      }
    }

    class EndScene extends Phaser.Scene {
      constructor() {
        super('EndScene');
      }

      create() {
        this.cameras.main.setBackgroundColor('#050509');

        this.add.text(GAME_WIDTH / 2, 125, 'Synthesis Complete', {
          fontFamily: 'Georgia, serif',
          fontSize: '48px',
          color: '#ffffff',
          align: 'center'
        }).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          270,
          'In Brother, Frankenstein, and Hamlet, characters are trapped by the masks society forces them to wear. The journey is not just reaching the end, but surviving the weight.',
          {
            fontFamily: 'Georgia, serif',
            fontSize: '27px',
            color: '#e8e8ff',
            align: 'center',
            wordWrap: { width: 790 }
          }
        ).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, 430, 'Press SPACE to return to the title screen', {
          fontFamily: 'Arial, sans-serif',
          fontSize: '21px',
          color: '#ffd35a'
        }).setOrigin(0.5);

        this.input.keyboard.once('keydown-SPACE', () => this.scene.start('StartScene'));
      }
    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      backgroundColor: '#050509',
      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 620 },
          debug: false
        }
      },
      scene: [StartScene, GameScene, EndScene],
      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      }
    };

    new Phaser.Game(config);
  </script>
</body>
</html>
