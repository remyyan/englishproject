      startTask(station) {
        if (this.taskComplete[station.taskId]) {
          this.showQuote('Task already completed. Move to the next book checkpoint.', 2200);
          return;
        }

        this.taskActive = true;
        this.currentTask = station.taskData;
        this.taskChoice = 0;
        this.taskPromptBox.setVisible(true);
        this.taskPromptText.setVisible(true);
        this.taskOptionText.setVisible(true);
        this.taskPromptText.setText(this.currentTask.question);
        this.taskOptionText.setText(this.formatTaskOptions());
      }

      formatTaskOptions() {
        return this.currentTask.options.map((option, index) => {
          return index === this.taskChoice ? `> ${option} <` : option;
        }).join('   ');
      }

      changeTaskChoice(direction) {
        if (!this.currentTask) return;
        this.taskChoice = Phaser.Math.Wrap(this.taskChoice + direction, 0, this.currentTask.options.length);
        this.taskOptionText.setText(this.formatTaskOptions());
      }

      submitTask() {
        if (!this.currentTask) return;
        const task = this.currentTask;
        const correct = task.answer === this.taskChoice;
        this.taskActive = false;
        this.taskPromptBox.setVisible(false);
        this.taskPromptText.setVisible(false);
        this.taskOptionText.setVisible(false);

        if (correct) {
          this.taskComplete[task.id] = true;
          this.showQuote(task.success, 2600);
          this.easePressure(-18);
        } else {
          this.spikePressure(18, 'TASK FAILED');
          this.showQuote('The task went wrong. The mask grows heavier.', 2600);
        }

        this.currentTask = null;
      }

      updateTaskInstruction() {
        if (this.taskActive) return;
        if (this.taskNearby) {
          if (this.taskComplete[this.taskNearby.taskId]) {
            this.taskInstructionText.setText('Task complete. Keep moving toward the next book.');
          } else {
            this.taskInstructionText.setText('Press E to begin the task and unlock the next checkpoint book.');
          }
        } else {
          this.taskInstructionText.setText('');
        }
      }
