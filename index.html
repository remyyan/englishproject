<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Weight of the Mask: An ENG4U Synthesis</title>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #050509;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    #game-container {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      image-rendering: pixelated;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.85);
    }
  </style>
</head>

<body>
  <div id="game-container"></div>

  <script>
    const GAME_WIDTH = 960;
    const GAME_HEIGHT = 540;
    const WORLD_WIDTH = 4200;
    const GROUND_Y = 500;

    class StartScene extends Phaser.Scene {
      constructor() {
        super('StartScene');
      }

      create() {
        this.cameras.main.setBackgroundColor('#050509');

        this.add.text(GAME_WIDTH / 2, 110, 'The Weight of the Mask', {
          fontFamily: 'Georgia, serif',
          fontSize: '50px',
          color: '#ffffff'
        }).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, 170, 'An ENG4U Literary Synthesis', {
          fontFamily: 'Georgia, serif',
          fontSize: '28px',
          color: '#d7d7ff'
        }).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          255,
          'Move through three literary worlds shaped by pressure, expectation, and identity.',
          {
            fontFamily: 'Arial',
            fontSize: '22px',
            color: '#eeeeee',
            align: 'center',
            wordWrap: { width: 780 }
          }
        ).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          325,
          'As societal pressure rises, gravity becomes heavier and movement becomes harder.',
          {
            fontFamily: 'Arial',
            fontSize: '20px',
            color: '#c8c8c8',
            align: 'center',
            wordWrap: { width: 700 }
          }
        ).setOrigin(0.5);

        this.add.text(GAME_WIDTH / 2, 390, 'Arrow Keys = Move   |   Spacebar = Jump', {
          fontFamily: 'Arial',
          fontSize: '20px',
          color: '#ffd35a'
        }).setOrigin(0.5);

        const beginText = this.add.text(
          GAME_WIDTH / 2,
          460,
          'Press SPACE to Begin',
          {
            fontFamily: 'Arial',
            fontSize: '26px',
            color: '#ffffff'
          }
        ).setOrigin(0.5);

        this.tweens.add({
          targets: beginText,
          alpha: 0.2,
          duration: 650,
          yoyo: true,
          repeat: -1
        });

        this.input.keyboard.once('keydown-SPACE', () => {
          this.scene.start('GameScene');
        });
      }
    }

    class GameScene extends Phaser.Scene {
      constructor() {
        super('GameScene');

        this.pressure = 0;
        this.lastPressureResetX = 80;
        this.currentJumpVelocity = -520;
        this.shakeCooldown = 0;
        this.lastWhisperTime = 0;
      }

      create() {
        this.pressure = 0;
        this.lastPressureResetX = 80;
        this.currentJumpVelocity = -520;

        this.physics.world.setBounds(0, 0, WORLD_WIDTH, GAME_HEIGHT);
        this.physics.world.gravity.y = 620;

        this.createWorldArt();
        this.createPlatforms();
        this.createPlayer();
        this.createCollectibles();
        this.createPortal();
        this.createUi();

        this.cameras.main.setBounds(0, 0, WORLD_WIDTH, GAME_HEIGHT);
        this.cameras.main.startFollow(this.player, true, 0.08, 0.08);

        this.cursors = this.input.keyboard.createCursorKeys();
        this.spaceKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
      }

      createWorldArt() {

        // BACKGROUNDS

        this.add.rectangle(650, 270, 1300, GAME_HEIGHT, 0x2b2624);
        this.add.rectangle(2050, 270, 1400, GAME_HEIGHT, 0x102a45);
        this.add.rectangle(3400, 270, 1800, GAME_HEIGHT, 0x170f2a);

        // ZONE TITLES

        this.add.text(80, 55, 'ZONE 1 — THE PARK (Brother)', {
          fontFamily: 'Georgia',
          fontSize: '26px',
          color: '#f2c26b'
        });

        this.add.text(1480, 55, 'ZONE 2 — THE LABORATORY (Frankenstein)', {
          fontFamily: 'Georgia',
          fontSize: '26px',
          color: '#bdefff'
        });

        this.add.text(2880, 55, 'ZONE 3 — THE CASTLE GRAVEYARD (Hamlet)', {
          fontFamily: 'Georgia',
          fontSize: '26px',
          color: '#d4b0ff'
        });

        // PRESSURE WORDS

        const pressureWords = [
          'BELONG',
          'MONSTER',
          'BE A MAN',
          'AVENGE',
          'PERFORM',
          'DO NOT FAIL',
          'OBEY',
          'HIDE',
          'PROVE YOURSELF',
          'ACT NORMAL'
        ];

        pressureWords.forEach((word, index) => {

          this.add.text(
            220 + (index * 360),
            Phaser.Math.Between(120, 420),
            word,
            {
              fontFamily: 'Arial',
              fontSize: '30px',
              color: '#ffffff'
            }
          )
          .setAlpha(0.05)
          .setRotation(Phaser.Math.FloatBetween(-0.25, 0.25));

        });

        // BROTHER ZONE ART

        for (let x = 140; x < 1200; x += 210) {

          this.add.rectangle(x, GROUND_Y - 60, 40, 120, 0x151515);

          this.add.rectangle(
            x + 24,
            GROUND_Y - 125,
            90,
            16,
            0x333333
          );

        }

        // FRANKENSTEIN LAB LIGHTS

        for (let x = 1450; x < 2500; x += 200) {

          this.add.rectangle(x, 260, 18, 250, 0xd9fbff)
            .setAlpha(0.16);

          this.add.rectangle(x + 40, 180, 70, 18, 0x9ff4ff)
            .setAlpha(0.35);

          const spark = this.add.circle(x, 110, 10, 0x9ff4ff);

          this.tweens.add({
            targets: spark,
            alpha: 0.15,
            duration: 120,
            yoyo: true,
            repeat: -1,
            delay: Phaser.Math.Between(0, 300)
          });

        }

        // HAMLET GRAVES

        for (let x = 2820; x < 4000; x += 180) {

          this.add.rectangle(x, GROUND_Y - 28, 80, 56, 0x2d2d36);

          this.add.rectangle(x, GROUND_Y - 65, 45, 18, 0x3a3a46);

          this.add.rectangle(x, GROUND_Y - 90, 15, 48, 0x3a3a46);

        }

        // FOG

        for (let i = 0; i < 22; i++) {

          this.add.ellipse(
            2800 + (i * 80),
            Phaser.Math.Between(380, 500),
            180,
            60,
            0xffffff,
            0.05
          );

        }

      }

      createPlatforms() {

        this.platforms = this.physics.add.staticGroup();

        const addPlatform = (x, y, width, height = 28) => {

          const platform = this.add.rectangle(
            x,
            y,
            width,
            height,
            0x303030
          );

          this.physics.add.existing(platform, true);

          this.platforms.add(platform);

        };

        addPlatform(WORLD_WIDTH / 2, GROUND_Y + 20, WORLD_WIDTH, 40);

        addPlatform(320, 410, 220);
        addPlatform(640, 350, 170);
        addPlatform(960, 430, 230);

        addPlatform(1250, 430, 180);
        addPlatform(1480, 390, 180);
        addPlatform(1720, 350, 170);
        addPlatform(1980, 390, 220);

        addPlatform(2250, 340, 190);

        addPlatform(2700, 420, 220);
        addPlatform(3000, 345, 170);
        addPlatform(3300, 405, 240);
        addPlatform(3600, 330, 200);

      }

      createPlayer() {

        this.player = this.add.rectangle(
          80,
          430,
          34,
          52,
          0xffffff
        );

        this.physics.add.existing(this.player);

        this.player.body.setCollideWorldBounds(true);

        this.player.body.setSize(34, 52);

        this.physics.add.collider(this.player, this.platforms);

      }

      createCollectibles() {

        this.collectibles = this.physics.add.staticGroup();

        const addCollectible = (x, y, symbol, quote) => {

          const item = this.add.container(x, y);

          const glow = this.add.circle(0, 0, 34, 0xffd23c, 0.18);

          const body = this.add.rectangle(0, 0, 38, 38, 0xffcc33);

          const text = this.add.text(0, 0, symbol, {
            fontFamily: 'Arial',
            fontSize: '24px',
            color: '#181818',
            fontStyle: 'bold'
          }).setOrigin(0.5);

          item.add([glow, body, text]);

          item.quote = quote;

          this.physics.add.existing(item, true);

          item.body.setSize(44, 44);

          this.collectibles.add(item);

          this.tweens.add({
            targets: item,
            y: y - 10,
            duration: 900,
            yoyo: true,
            repeat: -1
          });

        };

        addCollectible(
          760,
          302,
          '♫',
          '“We were children trying to find a way to belong.”'
        );

        addCollectible(
          2050,
          337,
          '⚡',
          '“I ought to be thy Adam, but I am rather the fallen angel.”'
        );

        addCollectible(
          3400,
          357,
          '☠',
          '“To be, or not to be: that is the question.”'
        );

        this.physics.add.overlap(
          this.player,
          this.collectibles,
          (_player, collectible) => {

            if (!collectible.active) return;

            collectible.body.enable = false;
            collectible.setActive(false);
            collectible.setVisible(false);

            this.resetPressure(collectible.quote);

          }
        );

      }

      createPortal() {

        this.portal = this.add.rectangle(
          4050,
          GROUND_Y - 75,
          70,
          130,
          0x8f5cff
        );

        this.portalInner = this.add.rectangle(
          4050,
          GROUND_Y - 75,
          44,
          100,
          0x0f0820
        );

        this.physics.add.existing(this.portal, true);

        this.tweens.add({
          targets: this.portal,
          alpha: 0.4,
          duration: 500,
          yoyo: true,
          repeat: -1
        });

        this.physics.add.overlap(
          this.player,
          this.portal,
          () => {
            this.scene.start('EndScene');
          }
        );

      }

      createUi() {

        this.add.rectangle(
          0,
          0,
          GAME_WIDTH,
          74,
          0x000000,
          0.65
        )
        .setOrigin(0, 0)
        .setScrollFactor(0)
        .setDepth(1000);

        this.add.text(24, 14, 'SOCIETAL PRESSURE', {
          fontFamily: 'Arial',
          fontSize: '17px',
          color: '#ffffff',
          fontStyle: 'bold'
        })
        .setScrollFactor(0)
        .setDepth(1001);

        this.pressureFrame = this.add.rectangle(
          24,
          43,
          360,
          18,
          0xffffff,
          0.2
        )
        .setOrigin(0, 0.5)
        .setScrollFactor(0)
        .setDepth(1001);

        this.pressureBar = this.add.rectangle(
          24,
          43,
          0,
          16,
          0xffd23c
        )
        .setOrigin(0, 0.5)
        .setScrollFactor(0)
        .setDepth(1002);

        this.pressureText = this.add.text(398, 33, '0%', {
          fontFamily: 'Arial',
          fontSize: '18px',
          color: '#ffffff'
        })
        .setScrollFactor(0)
        .setDepth(1001);

        this.warningText = this.add.text(
          GAME_WIDTH / 2,
          110,
          '',
          {
            fontFamily: 'Arial',
            fontSize: '28px',
            color: '#ff6666',
            fontStyle: 'bold'
          }
        )
        .setOrigin(0.5)
        .setScrollFactor(0)
        .setDepth(1001);

        this.quoteBox = this.add.rectangle(
          GAME_WIDTH / 2,
          170,
          790,
          72,
          0x000000,
          0.72
        )
        .setScrollFactor(0)
        .setDepth(1000)
        .setVisible(false);

        this.quoteText = this.add.text(
          GAME_WIDTH / 2,
          170,
          '',
          {
            fontFamily: 'Georgia',
            fontSize: '22px',
            color: '#fff2b6',
            align: 'center',
            wordWrap: { width: 740 }
          }
        )
        .setOrigin(0.5)
        .setScrollFactor(0)
        .setDepth(1001)
        .setVisible(false);

        this.struggleOverlay = this.add.rectangle(
          0,
          0,
          GAME_WIDTH,
          GAME_HEIGHT,
          0x777777,
          0
        )
        .setOrigin(0, 0)
        .setScrollFactor(0)
        .setDepth(900);

      }

      resetPressure(quote) {

        this.lastPressureResetX = this.player.x;

        this.pressure = 0;

        this.physics.world.gravity.y = 620;

        this.currentJumpVelocity = -520;

        this.showQuote(quote);

      }

      showQuote(quote) {

        this.quoteText.setText(quote);

        this.quoteBox.setVisible(true);

        this.quoteText.setVisible(true);

        this.time.delayedCall(3500, () => {

          this.quoteBox.setVisible(false);

          this.quoteText.setVisible(false);

        });

      }

      update(time, delta) {

        const speed = 225;

        if (this.cursors.left.isDown) {
          this.player.body.setVelocityX(-speed);
        }
        else if (this.cursors.right.isDown) {
          this.player.body.setVelocityX(speed);
        }
        else {
          this.player.body.setVelocityX(0);
        }

        if (
          Phaser.Input.Keyboard.JustDown(this.spaceKey) &&
          this.player.body.blocked.down
        ) {
          this.player.body.setVelocityY(this.currentJumpVelocity);
        }

        this.updatePressure(time, delta);

        this.updatePressureUi();

      }

      updatePressure(time, delta) {

    /*
      BALANCED PRESSURE SYSTEM

      These values still make pressure FEEL heavy,
      but keep the game playable.

      MAIN FIXES:
      - Pressure builds slower
      - Jump weakening is reduced
      - Gravity increase is less extreme
    */

    const PRESSURE_DISTANCE = 1450;

    const BASE_GRAVITY = 620;

    const MAX_EXTRA_GRAVITY = 360;

    const BASE_JUMP_VELOCITY = -520;

    const MAX_JUMP_LOSS = 120;

    const HIGH_PRESSURE_THRESHOLD = 75;

    const distanceSinceReset = Math.max(
      0,
      this.player.x - this.lastPressureResetX
    );

    this.pressure = Phaser.Math.Clamp(
      (distanceSinceReset / PRESSURE_DISTANCE) * 100,
      0,
      100
    );

    const pressureRatio = this.pressure / 100;

    // GRAVITY

    this.physics.world.gravity.y =
      BASE_GRAVITY + (MAX_EXTRA_GRAVITY * pressureRatio);

    // JUMP POWER

    this.currentJumpVelocity =
      BASE_JUMP_VELOCITY + (MAX_JUMP_LOSS * pressureRatio);

    // OVERLAY EFFECT

    this.struggleOverlay.setAlpha(
      Phaser.Math.Clamp((this.pressure - 60) / 220, 0, 0.18)
    );

    // CAMERA SHAKE

    this.shakeCooldown -= delta;

    if (
      this.pressure >= HIGH_PRESSURE_THRESHOLD &&
      this.shakeCooldown <= 0
    ) {

      const shakeStrength =
        0.002 + (pressureRatio * 0.003);

      this.cameras.main.shake(100, shakeStrength);

      this.shakeCooldown = 1300;

    }

    // WHISPERS

    if (
      this.pressure > 40 &&
      (!this.lastWhisperTime || time > this.lastWhisperTime + 5000)
    ) {

      const whispers = [
        '“Something is rotten in the state of Denmark.”',
        '“I ought to be thy Adam.”',
        '“Monster.”',
        '“Avenge.”',
        '“Perform.”',
        '“Belong.”',
        '“Do not fail.”'
      ];

      const whisper = this.add.text(
        this.player.x,
        this.player.y - 90,
        Phaser.Utils.Array.GetRandom(whispers),
        {
          fontFamily: 'Georgia',
          fontSize: '20px',
          color: '#ffffff'
        }
      ).setAlpha(0.6);

      this.tweens.add({
        targets: whisper,
        alpha: 0,
        y: whisper.y - 40,
        duration: 3000,
        onComplete: () => whisper.destroy()
      });

      this.lastWhisperTime = time;

    }

  }

      updatePressureUi() {

        const width = 360 * (this.pressure / 100);

        const color = Phaser.Display.Color.Interpolate.ColorWithColor(
          new Phaser.Display.Color(255, 210, 60),
          new Phaser.Display.Color(230, 42, 58),
          100,
          this.pressure
        );

        const colorValue = Phaser.Display.Color.GetColor(
          color.r,
          color.g,
          color.b
        );

        this.pressureBar.setSize(width, 16);

        this.pressureBar.setFillStyle(colorValue, 1);

        this.pressureBar.scaleY =
          1 + Math.sin(this.time.now / 120) * 0.08;

        this.pressureText.setText(`${Math.round(this.pressure)}%`);

        if (this.pressure > 85) {

          this.warningText.setText(
            'THE MASK IS BECOMING TOO HEAVY'
          );

        }
        else if (this.pressure > 65) {

          this.warningText.setText(
            'YOU ARE LOSING YOURSELF'
          );

        }
        else if (this.pressure > 40) {

          this.warningText.setText(
            'EXPECTATIONS ARE GROWING'
          );

        }
        else {

          this.warningText.setText('');

        }

      }

    }

    class EndScene extends Phaser.Scene {

      constructor() {
        super('EndScene');
      }

      create() {

        this.cameras.main.setBackgroundColor('#050509');

        this.add.text(
          GAME_WIDTH / 2,
          120,
          'Synthesis Complete',
          {
            fontFamily: 'Georgia',
            fontSize: '50px',
            color: '#ffffff'
          }
        ).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          265,
          'The journey through Brother, Frankenstein, and Hamlet reveals that societal expectations can shape, distort, and even destroy identity. The weight of the mask grows heavier the longer it is worn.',
          {
            fontFamily: 'Georgia',
            fontSize: '28px',
            color: '#e6e6ff',
            align: 'center',
            wordWrap: { width: 800 }
          }
        ).setOrigin(0.5);

        this.add.text(
          GAME_WIDTH / 2,
          420,
          'Press SPACE to return to the title screen',
          {
            fontFamily: 'Arial',
            fontSize: '22px',
            color: '#ffd35a'
          }
        ).setOrigin(0.5);

        this.input.keyboard.once('keydown-SPACE', () => {
          this.scene.start('StartScene');
        });

      }

    }

    const config = {
      type: Phaser.AUTO,
      parent: 'game-container',
      width: GAME_WIDTH,
      height: GAME_HEIGHT,
      backgroundColor: '#050509',

      physics: {
        default: 'arcade',
        arcade: {
          gravity: { y: 620 },
          debug: false
        }
      },

      scene: [
        StartScene,
        GameScene,
        EndScene
      ],

      scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
      }
    };

    new Phaser.Game(config);

  </script>
</body>
</html>
